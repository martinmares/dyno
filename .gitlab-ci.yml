stages:
  - verify
  - prepare
  - release

default:
  image: golang:1.26-bookworm

variables:
  GIT_DEPTH: "0"
  GOFLAGS: "-mod=readonly"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

cache:
  key: "go-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/go-build/
    - .cache/go-mod/

.release_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - VERSION

go_test:
  stage: verify
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl jq ca-certificates
  script:
    - go test ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release_notes:
  extends: .release_rules
  stage: prepare
  script:
    - bash scripts/ci_release_notes.sh
  artifacts:
    reports:
      dotenv: dist/release.env
    paths:
      - dist/release_notes.md
    expire_in: 30 days

publish_release:
  extends: .release_rules
  stage: release
  timeout: 1h
  resource_group: release
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl jq ca-certificates
  needs:
    - job: go_test
      artifacts: false
    - job: release_notes
      artifacts: true
  script:
    # Keep archives in this job and upload them individually to the registry.
    # A combined CI artifact can exceed the GitLab artifact upload limit.
    - bash scripts/ci_package_release.sh
    - bash scripts/ci_publish_release.sh
  artifacts:
    paths:
      - dist/release/SHA256SUMS
    expire_in: 30 days
